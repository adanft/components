name: NPM dist-tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag
        required: true
        default: 0.2.0-beta.6
      tag:
        description: Dist tag to move
        required: true
        default: beta
        type: choice
        options:
          - beta
          - latest

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Verify npm distribution tag
        env:
          DIST_TAG: ${{ inputs.tag }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: node scripts/verify-release-channel.mjs "${DIST_TAG}" "${PACKAGE_VERSION}"
      - name: Move npm dist-tag
        env:
          DIST_TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: npm dist-tag add "@adanft/ui@${PACKAGE_VERSION}" "${DIST_TAG}"
